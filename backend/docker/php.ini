; Werkstatt rechnet in Wiener Zeit (Arbeitsbeginn 07:00, Vorlaufzeit "ab morgen").
date.timezone = Europe/Vienna

expose_php = Off
memory_limit = 256M

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; Code aendert sich im Container nie – nur nach einem neuen Build.
opcache.validate_timestamps = 0
realpath_cache_size = 4096K
realpath_cache_ttl = 600
