  name: werkstatt

  services:
    database:
      image: mariadb:11.4
      restart: unless-stopped
      environment:
        MARIADB_DATABASE: werkstatt
        MARIADB_USER: werkstatt
        MARIADB_PASSWORD: werkstatt
        MARIADB_ROOT_PASSWORD: mariadb
      volumes:
        - db-data:/var/lib/mysql
      ports:
        - '127.0.0.1:3306:3306'
      healthcheck:
        test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
        interval: 10s
        timeout: 5s
        retries: 10

    backend:
      build: ./backend
      restart: unless-stopped
      environment:
        APP_ENV: prod
        APP_SECRET: dev-secret-nicht-fuer-produktion
        JWT_PASSPHRASE: dev-passphrase-nicht-fuer-produktion
        DATABASE_URL: 'mysql://werkstatt:werkstatt@database:3306/werkstatt?serverVersion=11.4.0-MariaDB&charset=utf8mb4'
      volumes:
        - jwt-keys:/app/config/jwt
      depends_on:
        database:
          condition: service_healthy

    frontend:
      build: ./frontend
      restart: unless-stopped
      ports:
        - '8080:80'
      depends_on:
        - backend

  volumes:
    db-data:
    jwt-keys:
