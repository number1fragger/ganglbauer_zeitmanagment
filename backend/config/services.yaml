parameters:
    # Standardwert, falls die Variable fehlt (z. B. im Docker-Image): keine fremden Domains
    env(CORS_ALLOW_ORIGIN): ''

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Dto/'
            - '../src/Entity/'
            - '../src/Enum/'
            - '../src/Util/'
            - '../src/Kernel.php'

    App\DataFixtures\:
        resource: '../src/DataFixtures/'
