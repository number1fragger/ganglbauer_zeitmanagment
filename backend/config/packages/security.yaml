security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: username

    # Chef darf alles, was der Vorarbeiter darf, und der alles, was der Arbeiter darf.
    role_hierarchy:
        ROLE_CHEF: [ROLE_VORARBEITER]
        ROLE_VORARBEITER: [ROLE_ARBEITER]

    firewalls:
        login:
            pattern: ^/api/login$
            stateless: true
            user_checker: App\Security\UserChecker
            json_login:
                check_path: api_login
                username_path: username
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        api:
            pattern: ^/api
            stateless: true
            user_checker: App\Security\UserChecker
            jwt: ~

    # Die Rechte je Aktion stehen als #[IsGranted] direkt an den Controllern.
    access_control:
        - { path: ^/api/(login|health)$, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
