services:
  mariadb:
    container_name: mariadb
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    # Prüft, ob die Datenbank erreichbar und vollständig initialisiert ist.
    # Prüfung alle 10 s, max. 5 s pro Versuch; nach 5 Fehlschlägen gilt der Container als "unhealthy".
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 10s
      timeout: 5s
      retries: 5

  vuejs-prod:
    container_name: vue.js
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"
    # Startet erst, wenn der Healthcheck der Datenbank erfolgreich war (Status "healthy").
    depends_on:
      mariadb:
        condition: service_healthy

volumes:
  db-data: