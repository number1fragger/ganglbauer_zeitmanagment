parameters:
    jwt_ttl: '%env(int:JWT_TTL)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Enum/'
            - '../src/Kernel.php'
            # Fixtures brauchen das Fixtures-Bundle, das es nur in dev/test gibt.
            - '../src/DataFixtures/'

    App\EventListener\ApiExceptionListener:
        arguments:
            $debug: '%kernel.debug%'

when@dev: &fixtures
    services:
        _defaults:
            autowire: true
            autoconfigure: true

        App\DataFixtures\:
            resource: '../src/DataFixtures/'

when@test: *fixtures
