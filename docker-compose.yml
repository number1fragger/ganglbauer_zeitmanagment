# Entwicklung: Nur die Datenbank laeuft im Container. Backend und Frontend
# startest du lokal mit ./dev.sh backend und ./dev.sh frontend.
# Den kompletten Stack in Containern gibt es unter docker/docker-compose.yml.
services:
  database:
    image: mariadb:11
    container_name: gz_database
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: zeitmanagement
      MARIADB_USER: zeitmanagement
      MARIADB_PASSWORD: zeitmanagement
    ports:
      - '3307:3306'
    volumes:
      - db_data:/var/lib/mysql
    # Prüft, ob die Datenbank erreichbar und vollständig initialisiert ist.
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
