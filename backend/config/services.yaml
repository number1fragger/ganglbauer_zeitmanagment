services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Dto/'
            - '../src/Entity/'
            - '../src/Enum/'
            - '../src/Util/'
            - '../src/Kernel.php'

    App\DataFixtures\:
        resource: '../src/DataFixtures/'
