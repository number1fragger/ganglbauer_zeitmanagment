# Liefert die Vue-App aus und reicht /api per FastCGI an PHP-FPM ("backend") weiter.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 2m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # Docker-DNS. Weil der Upstream in einer Variable steht, loest nginx
    # "backend" erst bei einer Anfrage auf und startet auch dann, wenn das
    # Backend (noch) nicht laeuft – frueher hat genau das den Container
    # mit "host not found in upstream" abstuerzen lassen.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api {
        set $backend backend:9000;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /app/public;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass $backend;
    }

    # Dateinamen enthalten einen Hash und koennen ewig gecacht werden.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Alle anderen Pfade gehoeren dem Vue-Router.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
