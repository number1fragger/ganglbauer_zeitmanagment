# Gesamte App fuer den Server: docker compose up -d --build
# Fuer die Entwicklung reicht die Datenbank: docker compose up -d database
# Werte kommen aus der .env neben dieser Datei (Vorlage: .env.example).
name: werkstatt

services:
  database:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: werkstatt
      MARIADB_USER: werkstatt
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD in .env setzen}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD in .env setzen}
    volumes:
      - db-data:/var/lib/mysql
    # Nur vom Server selbst erreichbar, nie aus dem Internet.
    ports:
      - '127.0.0.1:${DB_PORT:-3306}:3306'
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      APP_SECRET: ${APP_SECRET:?APP_SECRET in .env setzen}
      JWT_PASSPHRASE: ${JWT_PASSPHRASE:?JWT_PASSPHRASE in .env setzen}
      DATABASE_URL: mysql://werkstatt:${DB_PASSWORD}@database:3306/werkstatt?serverVersion=11.4.0-MariaDB&charset=utf8mb4
    volumes:
      - jwt-keys:/app/config/jwt
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-8080}:80'
    depends_on:
      - backend

volumes:
  db-data:
  jwt-keys:
