server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API-Aufrufe gehen an den Backend-Container.
    location /api/ {
        proxy_pass http://backend:80;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Gebaute Dateien haben einen Hash im Namen und duerfen lange gecacht werden.
    # (expires statt add_header: sonst gingen die Sicherheits-Header oben verloren.)
    location /assets/ {
        expires 1y;
    }

    # Vue-Router (History-Modus): unbekannte Pfade liefern index.html.
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
